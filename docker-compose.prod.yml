# ============================================================================
# TERRANOVA — ORQUESTACIÓN PRODUCTIVA DOCKER COMPOSE (PROD & ON-PREMISE AIR-GAPPED)
# ============================================================================

version: '3.8'

services:
  # 1. Base de Datos Relacional y Geoespacial
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: terranova-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-terranova_db}
      POSTGRES_USER: ${POSTGRES_USER:-terranova_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-TerranovaSecurePass2026!}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terranova_admin} -d ${POSTGRES_DB:-terranova_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - terranova_internal_network

  # 2. Motor de Caché y Sesiones Criptográficas
  redis:
    image: redis:7-alpine
    container_name: terranova-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-TerranovaRedisSecret2026!}
    volumes:
      - redisdata_prod:/data
    networks:
      - terranova_internal_network

  # 3. Backend API NestJS
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: terranova-api-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-terranova_admin}:${POSTGRES_PASSWORD:-TerranovaSecurePass2026!}@postgres:5432/${POSTGRES_DB:-terranova_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-TerranovaRedisSecret2026!}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-industrial-jwt-secret-terranova-2026}
      AUDIT_HMAC_SECRET: ${AUDIT_HMAC_SECRET:-terranova-industrial-secret-key-2026}
    networks:
      - terranova_internal_network

  # 4. Frontend Web Nginx (Single Page Application + Reverse Proxy)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: terranova-web-prod
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    networks:
      - terranova_internal_network

networks:
  terranova_internal_network:
    driver: bridge

volumes:
  pgdata_prod:
  redisdata_prod:
